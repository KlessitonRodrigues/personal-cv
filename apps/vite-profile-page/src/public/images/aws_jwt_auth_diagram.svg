<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrowDark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrowSlate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>

    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>

    <!-- folder icon (stack source code) -->
    <g id="folder">
      <path d="M -36 -20 H -12 L -4 -12 H -36 Z" fill="#bfdbfe" stroke="#2563eb" stroke-width="3" stroke-linejoin="round"/>
      <rect x="-36" y="-12" width="72" height="40" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
    </g>

    <!-- gear icon (AWS CDK) -->
    <g id="gear">
      <g fill="#7c3aed">
        <rect x="-7" y="-32" width="14" height="16" rx="4"/>
        <rect x="-7" y="-32" width="14" height="16" rx="4" transform="rotate(45)"/>
        <rect x="-7" y="-32" width="14" height="16" rx="4" transform="rotate(90)"/>
        <rect x="-7" y="-32" width="14" height="16" rx="4" transform="rotate(135)"/>
        <rect x="-7" y="-32" width="14" height="16" rx="4" transform="rotate(180)"/>
        <rect x="-7" y="-32" width="14" height="16" rx="4" transform="rotate(225)"/>
        <rect x="-7" y="-32" width="14" height="16" rx="4" transform="rotate(270)"/>
        <rect x="-7" y="-32" width="14" height="16" rx="4" transform="rotate(315)"/>
      </g>
      <circle r="25" fill="#7c3aed"/>
      <circle r="11" fill="#f8fafc"/>
    </g>

    <!-- cloud icon (AWS cloud / CloudFormation stack) -->
    <g id="cfcloud">
      <path d="M 30 70 C 12 70 0 58 0 44 C 0 32 9 22 21 20 C 25 8 37 0 51 0 C 66 0 78 10 80 24 C 92 26 100 35 100 47 C 100 61 89 70 76 70 Z" fill="#ff9900"/>
      <path d="M 56 18 L 42 42 H 52 L 45 58 L 64 34 H 53 L 60 18 Z" fill="#ffffff"/>
    </g>

    <!-- globe icon (users) -->
    <g id="globe">
      <circle r="30" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/>
      <ellipse rx="13" ry="30" fill="none" stroke="#0284c7" stroke-width="2.5"/>
      <line x1="-30" y1="0" x2="30" y2="0" stroke="#0284c7" stroke-width="2.5"/>
      <path d="M -26 -13 H 26 M -26 13 H 26" stroke="#0284c7" stroke-width="2.5" fill="none"/>
    </g>

    <!-- gateway icon (Amazon API Gateway) -->
    <g id="gateway">
      <path d="M -20 30 L -20 -2 C -20 -20 -8 -30 0 -30 C 8 -30 20 -20 20 -2 L 20 30 Z" fill="#dcfce7" stroke="#16a34a" stroke-width="3" stroke-linejoin="round"/>
      <path d="M -10 0 H 8 M 0 -8 L 10 0 L 0 8" fill="none" stroke="#16a34a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- lambda glyph (AWS Lambda) -->
    <g id="lambdaglyph">
      <text x="0" y="16" text-anchor="middle" font-size="54" font-style="italic" font-weight="700" fill="#ea580c" font-family="Georgia, 'Times New Roman', serif">λ</text>
    </g>

    <!-- dynamo icon (Amazon DynamoDB) -->
    <g id="dynamo">
      <path d="M -30 -14 V 14 C -30 19.5 -16.6 24 0 24 C 16.6 24 30 19.5 30 14 V -14" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
      <ellipse cx="0" cy="-14" rx="30" ry="10" fill="#93c5fd" stroke="#2563eb" stroke-width="3"/>
      <path d="M -30 0 C -30 5.5 -16.6 10 0 10 C 16.6 10 30 5.5 30 0" fill="none" stroke="#2563eb" stroke-width="2.5"/>
    </g>
  </defs>

  <rect width="1920" height="1080" fill="#f8fafc"/>

  <!-- title -->
  <text x="960" y="95" text-anchor="middle" font-size="44" font-weight="800" fill="#0f172a">JWT Auth API — AWS CDK</text>
  <text x="960" y="138" text-anchor="middle" font-size="22" fill="#64748b">Express-style auth services deployed as Lambda functions behind Amazon API Gateway, backed by DynamoDB</text>

  <!-- band labels -->
  <text x="960" y="265" text-anchor="middle" font-size="20" font-weight="700" letter-spacing="4" fill="#2563eb">DEPLOYMENT FLOW</text>
  <text x="300" y="620" text-anchor="middle" font-size="20" font-weight="700" letter-spacing="4" fill="#16a34a">REQUEST FLOW</text>

  <!-- ===== deployment flow ===== -->

  <!-- card: CDK stack source -->
  <rect x="300" y="300" width="320" height="195" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="url(#cardShadow)"/>
  <circle cx="460" cy="360" r="46" fill="#eff6ff"/>
  <use href="#folder" transform="translate(460 362) scale(1.1)"/>
  <text x="460" y="430" text-anchor="middle" font-size="25" font-weight="700" fill="#0f172a">CDK Stack Code</text>
  <text x="460" y="458" text-anchor="middle" font-size="16" fill="#64748b">NodeTemplateStack · src/stack.ts</text>
  <text x="460" y="481" text-anchor="middle" font-size="14.5" fill="#94a3b8">TypeScript constructs</text>

  <!-- card: AWS CDK -->
  <rect x="800" y="300" width="320" height="195" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="url(#cardShadow)"/>
  <circle cx="960" cy="360" r="46" fill="#f5f3ff"/>
  <use href="#gear" transform="translate(960 362) scale(1.05)"/>
  <text x="960" y="430" text-anchor="middle" font-size="25" font-weight="700" fill="#0f172a">AWS CDK</text>
  <text x="960" y="458" text-anchor="middle" font-size="16" fill="#64748b">cdk synth → cdk deploy</text>
  <text x="960" y="481" text-anchor="middle" font-size="14.5" fill="#94a3b8">yarn cdk-deploy</text>

  <!-- card: AWS cloud stack -->
  <rect x="1300" y="300" width="320" height="195" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="url(#cardShadow)"/>
  <circle cx="1460" cy="360" r="46" fill="#fff7ed"/>
  <use href="#cfcloud" transform="translate(1405 338) scale(1.05)"/>
  <text x="1460" y="430" text-anchor="middle" font-size="25" font-weight="700" fill="#0f172a">CloudFormation</text>
  <text x="1460" y="458" text-anchor="middle" font-size="16" fill="#64748b">auth-api-dev stack</text>
  <text x="1460" y="481" text-anchor="middle" font-size="14.5" fill="#94a3b8">API GW · Lambda ×8 · DDB · Logs</text>

  <!-- ===== request flow ===== -->

  <!-- card: users -->
  <rect x="140" y="650" width="320" height="195" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="url(#cardShadow)"/>
  <circle cx="300" cy="712" r="46" fill="#f0f9ff"/>
  <use href="#globe" transform="translate(300 712) scale(1.15)"/>
  <text x="300" y="780" text-anchor="middle" font-size="25" font-weight="700" fill="#0f172a">Users</text>
  <text x="300" y="808" text-anchor="middle" font-size="16" fill="#64748b">Auth App · Dashboard App</text>
  <text x="300" y="831" text-anchor="middle" font-size="14.5" fill="#94a3b8">receives JWT access token (1h)</text>

  <!-- card: API Gateway -->
  <rect x="580" y="650" width="320" height="195" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="url(#cardShadow)"/>
  <circle cx="740" cy="712" r="46" fill="#f0fdf4"/>
  <use href="#gateway" transform="translate(740 714) scale(1.05)"/>
  <text x="740" y="780" text-anchor="middle" font-size="25" font-weight="700" fill="#0f172a">API Gateway</text>
  <text x="740" y="808" text-anchor="middle" font-size="16" fill="#64748b">auth-api-dev-auth-api-gateway</text>
  <text x="740" y="831" text-anchor="middle" font-size="14.5" fill="#94a3b8">POST /auth/* · CORS preflight</text>

  <!-- card: lambda functions -->
  <rect x="1020" y="650" width="320" height="195" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="url(#cardShadow)"/>
  <circle cx="1180" cy="712" r="46" fill="#fff7ed"/>
  <use href="#lambdaglyph" transform="translate(1180 716)"/>
  <text x="1180" y="780" text-anchor="middle" font-size="25" font-weight="700" fill="#0f172a">Lambda Functions</text>
  <text x="1180" y="808" text-anchor="middle" font-size="16" fill="#64748b">8× Node.js 22.x · 10s timeout</text>
  <text x="1180" y="831" text-anchor="middle" font-size="14.5" fill="#94a3b8">jsonwebtoken · bcrypt · zod</text>

  <!-- card: DynamoDB -->
  <rect x="1460" y="650" width="320" height="195" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="url(#cardShadow)"/>
  <circle cx="1620" cy="712" r="46" fill="#eff6ff"/>
  <use href="#dynamo" transform="translate(1620 716) scale(1.05)"/>
  <text x="1620" y="780" text-anchor="middle" font-size="25" font-weight="700" fill="#0f172a">DynamoDB</text>
  <text x="1620" y="808" text-anchor="middle" font-size="16" fill="#64748b">auth-api-dev-auth-table</text>
  <text x="1620" y="831" text-anchor="middle" font-size="14.5" fill="#94a3b8">PK userId · GSI emailIndex · on-demand</text>

  <!-- ===== arrows : deployment ===== -->
  <line x1="624" y1="397" x2="792" y2="397" stroke="#334155" stroke-width="3.5" marker-end="url(#arrowDark)"/>
  <text x="708" y="380" text-anchor="middle" font-size="16" fill="#334155">cdk synth</text>

  <line x1="1124" y1="397" x2="1292" y2="397" stroke="#334155" stroke-width="3.5" marker-end="url(#arrowDark)"/>
  <text x="1208" y="380" text-anchor="middle" font-size="16" fill="#334155">yarn cdk-deploy</text>

  <!-- ===== arrows : request flow ===== -->
  <line x1="464" y1="747" x2="576" y2="747" stroke="#334155" stroke-width="3.5" marker-end="url(#arrowDark)"/>
  <text x="520" y="730" text-anchor="middle" font-size="15" fill="#334155">HTTPS POST</text>

  <line x1="904" y1="747" x2="1016" y2="747" stroke="#334155" stroke-width="3.5" marker-end="url(#arrowDark)"/>
  <text x="960" y="730" text-anchor="middle" font-size="15" fill="#334155">invoke</text>

  <line x1="1344" y1="747" x2="1456" y2="747" stroke="#334155" stroke-width="3.5" marker-end="url(#arrowDark)"/>
  <text x="1400" y="730" text-anchor="middle" font-size="15" fill="#334155">read / write</text>

  <!-- token response : Lambda -> Users -->
  <path d="M 1180 644 V 560 H 300 V 642" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#arrowSlate)"/>
  <text x="740" y="548" text-anchor="middle" font-size="15" fill="#64748b">JWT access token · 1h expiry</text>

  <!-- ===== legend ===== -->
  <use href="#gear" transform="translate(250 932) scale(0.38)"/>
  <text x="282" y="946" font-size="17" fill="#475569">AWS CDK</text>

  <use href="#cfcloud" transform="translate(480 916) scale(0.4)"/>
  <text x="534" y="946" font-size="17" fill="#475569">AWS CloudFormation stack</text>

  <use href="#gateway" transform="translate(830 932) scale(0.5)"/>
  <text x="862" y="946" font-size="17" fill="#475569">API Gateway</text>

  <use href="#lambdaglyph" transform="translate(1070 940) scale(0.7)"/>
  <text x="1092" y="946" font-size="17" fill="#475569">Lambda functions</text>

  <use href="#dynamo" transform="translate(1320 926) scale(0.55)"/>
  <text x="1362" y="946" font-size="17" fill="#475569">DynamoDB</text>

  <use href="#globe" transform="translate(1530 932) scale(0.42)"/>
  <text x="1564" y="946" font-size="17" fill="#475569">End users</text>

  <!-- footnote -->
  <text x="960" y="1020" text-anchor="middle" font-size="16" fill="#94a3b8">Stack: auth-api-dev (NodeTemplateStack, src/stack.ts) · Deploy: yarn cdk-deploy · Local dev: yarn dev → Express :3005 · Logs: auth-api-dev-log-group (1 week)</text>
</svg>
