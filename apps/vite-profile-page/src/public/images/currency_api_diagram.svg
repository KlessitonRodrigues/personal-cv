<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrowDark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrowSlate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>

    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>

    <!-- database cylinder (PostgreSQL) -->
    <g id="dbCyl">
      <path d="M -34 -14 L -34 20 A 34 11 0 0 0 34 20 L 34 -14" fill="#e0e7ff" stroke="#4f46e5" stroke-width="3" stroke-linejoin="round"/>
      <ellipse cx="0" cy="-14" rx="34" ry="11" fill="#c7d2fe" stroke="#4f46e5" stroke-width="3"/>
    </g>

    <!-- database cylinder (external Currency Exchange API) -->
    <g id="apiCyl">
      <path d="M -34 -14 L -34 20 A 34 11 0 0 0 34 20 L 34 -14" fill="#ccfbf1" stroke="#0d9488" stroke-width="3" stroke-linejoin="round"/>
      <ellipse cx="0" cy="-14" rx="34" ry="11" fill="#99f6e4" stroke="#0d9488" stroke-width="3"/>
    </g>

    <!-- gear icon (NodeJS backend) -->
    <g id="gear">
      <g fill="#7c3aed">
        <rect x="-7" y="-32" width="14" height="16" rx="4"/>
        <rect x="-7" y="-32" width="14" height="16" rx="4" transform="rotate(45)"/>
        <rect x="-7" y="-32" width="14" height="16" rx="4" transform="rotate(90)"/>
        <rect x="-7" y="-32" width="14" height="16" rx="4" transform="rotate(135)"/>
        <rect x="-7" y="-32" width="14" height="16" rx="4" transform="rotate(180)"/>
        <rect x="-7" y="-32" width="14" height="16" rx="4" transform="rotate(225)"/>
        <rect x="-7" y="-32" width="14" height="16" rx="4" transform="rotate(270)"/>
        <rect x="-7" y="-32" width="14" height="16" rx="4" transform="rotate(315)"/>
      </g>
      <circle r="25" fill="#7c3aed"/>
      <circle r="11" fill="#f8fafc"/>
    </g>

    <!-- browser icon (NextJS web app) -->
    <g id="browser">
      <rect x="-36" y="-28" width="72" height="56" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
      <line x1="-36" y1="-13" x2="36" y2="-13" stroke="#2563eb" stroke-width="3"/>
      <circle cx="-25" cy="-20.5" r="3.2" fill="#2563eb"/>
      <circle cx="-15" cy="-20.5" r="3.2" fill="#2563eb"/>
      <circle cx="-5" cy="-20.5" r="3.2" fill="#2563eb"/>
      <rect x="-26" y="-3" width="52" height="7" rx="3.5" fill="#bfdbfe"/>
      <rect x="-26" y="10" width="36" height="7" rx="3.5" fill="#bfdbfe"/>
    </g>

    <!-- globe icon (users) -->
    <g id="globe">
      <circle r="30" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/>
      <ellipse rx="13" ry="30" fill="none" stroke="#0284c7" stroke-width="2.5"/>
      <line x1="-30" y1="0" x2="30" y2="0" stroke="#0284c7" stroke-width="2.5"/>
      <path d="M -26 -13 H 26 M -26 13 H 26" stroke="#0284c7" stroke-width="2.5" fill="none"/>
    </g>
  </defs>

  <rect width="1920" height="1080" fill="#f8fafc"/>

  <!-- title -->
  <text x="960" y="95" text-anchor="middle" font-size="44" font-weight="800" fill="#0f172a">Currency Exchange — System Architecture</text>
  <text x="960" y="138" text-anchor="middle" font-size="22" fill="#64748b">NodeJS backend (Express + WebSocket) serving a NextJS web app with rates from an external API</text>

  <!-- band labels -->
  <text x="960" y="185" text-anchor="middle" font-size="20" font-weight="700" letter-spacing="4" fill="#4f46e5">PERSISTENCE</text>
  <text x="655" y="480" text-anchor="middle" font-size="20" font-weight="700" letter-spacing="4" fill="#0d9488">REQUEST FLOW</text>
  <text x="1290" y="890" text-anchor="middle" font-size="20" font-weight="700" letter-spacing="4" fill="#16a34a">REALTIME FLOW</text>

  <!-- ===== persistence ===== -->

  <!-- card: PostgreSQL -->
  <rect x="800" y="220" width="320" height="195" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="url(#cardShadow)"/>
  <circle cx="960" cy="282" r="46" fill="#eef2ff"/>
  <use href="#dbCyl" transform="translate(960 286) scale(1.05)"/>
  <text x="960" y="350" text-anchor="middle" font-size="25" font-weight="700" fill="#0f172a">DataBase</text>
  <text x="960" y="378" text-anchor="middle" font-size="16" fill="#64748b">PostgreSQL</text>
  <text x="960" y="401" text-anchor="middle" font-size="14.5" fill="#94a3b8">stores users history</text>

  <!-- ===== request flow ===== -->

  <!-- card: Currency Exchange API (external) -->
  <rect x="200" y="560" width="320" height="195" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="url(#cardShadow)"/>
  <circle cx="360" cy="622" r="46" fill="#f0fdfa"/>
  <use href="#apiCyl" transform="translate(360 626) scale(1.05)"/>
  <text x="360" y="690" text-anchor="middle" font-size="25" font-weight="700" fill="#0f172a">Currency Exchange API</text>
  <text x="360" y="718" text-anchor="middle" font-size="16" fill="#64748b">external service</text>
  <text x="360" y="741" text-anchor="middle" font-size="14.5" fill="#94a3b8">rates · currencies</text>

  <!-- card: Backend (NodeJS) -->
  <rect x="790" y="530" width="340" height="340" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="url(#cardShadow)"/>
  <circle cx="960" cy="592" r="46" fill="#f5f3ff"/>
  <use href="#gear" transform="translate(960 594) scale(1.05)"/>
  <text x="960" y="662" text-anchor="middle" font-size="25" font-weight="700" fill="#0f172a">Backend (NodeJS)</text>

  <rect x="830" y="680" width="260" height="80" rx="12" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2.5"/>
  <text x="960" y="713" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">API</text>
  <text x="960" y="740" text-anchor="middle" font-size="16" fill="#64748b">ExpressJS</text>

  <rect x="830" y="775" width="260" height="70" rx="12" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2.5"/>
  <text x="960" y="803" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Websocket</text>
  <text x="960" y="828" text-anchor="middle" font-size="14.5" fill="#94a3b8">live rate updates</text>

  <!-- card: WEB (NextJS) -->
  <rect x="1400" y="560" width="320" height="195" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="url(#cardShadow)"/>
  <circle cx="1560" cy="622" r="46" fill="#eff6ff"/>
  <use href="#browser" transform="translate(1560 624) scale(1.05)"/>
  <text x="1560" y="690" text-anchor="middle" font-size="25" font-weight="700" fill="#0f172a">WEB</text>
  <text x="1560" y="718" text-anchor="middle" font-size="16" fill="#64748b">NextJS</text>
  <text x="1560" y="741" text-anchor="middle" font-size="14.5" fill="#94a3b8">end users · browsers</text>

  <!-- ===== arrows : persistence ===== -->
  <line x1="960" y1="423" x2="960" y2="522" stroke="#334155" stroke-width="3.5" marker-start="url(#arrowDark)" marker-end="url(#arrowDark)"/>
  <text x="980" y="478" text-anchor="start" font-size="16" fill="#334155">Users History</text>

  <!-- ===== arrows : request flow ===== -->
  <line x1="528" y1="665" x2="782" y2="665" stroke="#334155" stroke-width="3.5" marker-start="url(#arrowDark)" marker-end="url(#arrowDark)"/>
  <text x="655" y="614" text-anchor="middle" font-size="15" fill="#334155">GET Currencies</text>
  <text x="655" y="638" text-anchor="middle" font-size="15" fill="#334155">POST Currency Exchange</text>

  <line x1="1138" y1="665" x2="1392" y2="665" stroke="#334155" stroke-width="3.5" marker-start="url(#arrowDark)" marker-end="url(#arrowDark)"/>
  <text x="1265" y="600" text-anchor="middle" font-size="15" fill="#334155">POST Auth · POST Auth/create</text>
  <text x="1265" y="624" text-anchor="middle" font-size="15" fill="#334155">GET Currencies</text>
  <text x="1265" y="648" text-anchor="middle" font-size="15" fill="#334155">POST Currency Exchange</text>

  <!-- ===== arrows : realtime flow ===== -->
  <path d="M 1098 810 H 1560 V 763" fill="none" stroke="#16a34a" stroke-width="3.5" marker-end="url(#arrowDark)"/>
  <rect x="1135" y="772" width="310" height="46" rx="23" fill="#f0fdf4" stroke="#86efac" stroke-width="2" filter="url(#cardShadow)"/>
  <text x="1290" y="801" text-anchor="middle" font-size="15" font-weight="600" fill="#15803d">Exchange Rate GBP → USD · each 2m</text>

  <!-- ===== legend ===== -->
  <use href="#apiCyl" transform="translate(380 938) scale(0.5)"/>
  <text x="412" y="950" font-size="17" fill="#475569">External Currency Exchange API</text>

  <use href="#gear" transform="translate(720 936) scale(0.38)"/>
  <text x="752" y="950" font-size="17" fill="#475569">Backend NodeJS (Express + Websocket)</text>

  <use href="#dbCyl" transform="translate(1080 932) scale(0.42)"/>
  <text x="1112" y="950" font-size="17" fill="#475569">PostgreSQL</text>

  <use href="#browser" transform="translate(1310 936) scale(0.5)"/>
  <text x="1356" y="950" font-size="17" fill="#475569">NextJS web app</text>

  <use href="#globe" transform="translate(1560 936) scale(0.42)"/>
  <text x="1594" y="950" font-size="17" fill="#475569">End users</text>

  <!-- footnote -->
  <text x="960" y="1020" text-anchor="middle" font-size="16" fill="#94a3b8">Backend: NodeJS (API ExpressJS + Websocket) · DataBase: PostgreSQL · Web: NextJS</text>
</svg>
