<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrowDark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrowSlate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>

    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>

    <!-- js file icon (index.js entry point) -->
    <g id="jsfile">
      <path d="M -28 -38 H 12 L 30 -20 V 38 H -28 Z" fill="#fef9c3" stroke="#ca8a04" stroke-width="3" stroke-linejoin="round"/>
      <path d="M 12 -38 V -20 H 30 Z" fill="none" stroke="#ca8a04" stroke-width="3" stroke-linejoin="round"/>
      <text x="1" y="10" text-anchor="middle" font-size="22" font-weight="700" fill="#a16207">JS</text>
    </g>

    <!-- react component icon (src.app.tsx) -->
    <g id="react">
      <ellipse rx="42" ry="16" fill="none" stroke="#0891b2" stroke-width="3"/>
      <ellipse rx="42" ry="16" fill="none" stroke="#0891b2" stroke-width="3" transform="rotate(60)"/>
      <ellipse rx="42" ry="16" fill="none" stroke="#0891b2" stroke-width="3" transform="rotate(120)"/>
      <circle r="9" fill="#0891b2"/>
    </g>

    <!-- webview browser icon (react-native-webview) -->
    <g id="webview">
      <rect x="-46" y="-38" width="92" height="76" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="3.5"/>
      <line x1="-46" y1="-16" x2="46" y2="-16" stroke="#2563eb" stroke-width="3.5"/>
      <circle cx="-33" cy="-27" r="3.5" fill="#2563eb"/>
      <circle cx="-21" cy="-27" r="3.5" fill="#93c5fd"/>
      <circle cx="-9" cy="-27" r="3.5" fill="#93c5fd"/>
      <g transform="translate(0 13)">
        <circle r="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="2.5"/>
        <ellipse rx="6" ry="14" fill="none" stroke="#0284c7" stroke-width="2"/>
        <line x1="-14" y1="0" x2="14" y2="0" stroke="#0284c7" stroke-width="2"/>
      </g>
    </g>

    <!-- globe icon (target url) -->
    <g id="globe">
      <circle r="30" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/>
      <ellipse rx="13" ry="30" fill="none" stroke="#0284c7" stroke-width="2.5"/>
      <line x1="-30" y1="0" x2="30" y2="0" stroke="#0284c7" stroke-width="2.5"/>
      <path d="M -26 -13 H 26 M -26 13 H 26" stroke="#0284c7" stroke-width="2.5" fill="none"/>
    </g>

    <!-- docker whale icon -->
    <g id="docker">
      <g fill="#1d4ed8">
        <rect x="-38" y="-6" width="13" height="11" rx="2"/>
        <rect x="-22" y="-6" width="13" height="11" rx="2"/>
        <rect x="-6" y="-6" width="13" height="11" rx="2"/>
        <rect x="-22" y="-20" width="13" height="11" rx="2"/>
        <rect x="-6" y="-20" width="13" height="11" rx="2"/>
        <path d="M -44 8 H 30 C 44 8 50 0 50 -8 C 56 -8 62 -2 60 6 C 56 18 42 26 24 26 H -30 C -40 26 -46 18 -44 8 Z"/>
      </g>
    </g>

    <!-- EAS cloud icon -->
    <g id="eascloud">
      <path d="M 30 46 C 12 46 0 34 0 20 C 0 8 9 -2 21 -4 C 25 -16 37 -24 51 -24 C 66 -24 78 -14 80 0 C 92 2 100 11 100 23 C 100 37 89 46 76 46 Z" fill="#4630eb"/>
      <text x="48" y="30" text-anchor="middle" font-size="26" font-weight="800" fill="#ffffff">EAS</text>
    </g>

    <!-- apk package icon -->
    <g id="apk">
      <path d="M -30 -38 H 14 L 34 -18 V 38 H -30 Z" fill="#dcfce7" stroke="#16a34a" stroke-width="3" stroke-linejoin="round"/>
      <path d="M 14 -38 V -18 H 34 Z" fill="none" stroke="#16a34a" stroke-width="3" stroke-linejoin="round"/>
      <path d="M -10 8 V -2 L 0 -10 L 10 -2 V 8 Z M -10 0 H 10" fill="#16a34a"/>
    </g>
  </defs>

  <rect width="1920" height="1080" fill="#f8fafc"/>

  <!-- title -->
  <text x="960" y="95" text-anchor="middle" font-size="44" font-weight="800" fill="#0f172a">Expo WebView App — Runtime &amp; APK Build Flow</text>
  <text x="960" y="138" text-anchor="middle" font-size="22" fill="#64748b">Expo (React Native) app rendering a WebView, packaged into an Android APK with EAS CLI inside Docker</text>

  <!-- band labels -->
  <text x="960" y="265" text-anchor="middle" font-size="20" font-weight="700" letter-spacing="4" fill="#2563eb">RUNTIME FLOW</text>
  <text x="960" y="615" text-anchor="middle" font-size="20" font-weight="700" letter-spacing="4" fill="#16a34a">BUILD FLOW</text>

  <!-- ===== runtime flow ===== -->

  <!-- card: index.js -->
  <rect x="60" y="300" width="320" height="195" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="url(#cardShadow)"/>
  <circle cx="220" cy="360" r="46" fill="#fefce8"/>
  <use href="#jsfile" transform="translate(220 362) scale(1.05)"/>
  <text x="220" y="430" text-anchor="middle" font-size="25" font-weight="700" fill="#0f172a">index.js</text>
  <text x="220" y="458" text-anchor="middle" font-size="16" fill="#64748b">Expo entry point</text>
  <text x="220" y="481" text-anchor="middle" font-size="14.5" fill="#94a3b8">registerRootComponent(App)</text>

  <!-- card: App component -->
  <rect x="560" y="300" width="320" height="195" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="url(#cardShadow)"/>
  <circle cx="720" cy="360" r="46" fill="#ecfeff"/>
  <use href="#react" transform="translate(720 362) scale(0.75)"/>
  <text x="720" y="430" text-anchor="middle" font-size="25" font-weight="700" fill="#0f172a">App Component</text>
  <text x="720" y="458" text-anchor="middle" font-size="16" fill="#64748b">src/src.app.tsx</text>
  <text x="720" y="481" text-anchor="middle" font-size="14.5" fill="#94a3b8">StatusBar + WebView in a View</text>

  <!-- card: WebView -->
  <rect x="1060" y="300" width="320" height="195" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="url(#cardShadow)"/>
  <circle cx="1220" cy="360" r="46" fill="#eff6ff"/>
  <use href="#webview" transform="translate(1220 362) scale(0.85)"/>
  <text x="1220" y="430" text-anchor="middle" font-size="25" font-weight="700" fill="#0f172a">WebView</text>
  <text x="1220" y="458" text-anchor="middle" font-size="16" fill="#64748b">react-native-webview</text>
  <text x="1220" y="481" text-anchor="middle" font-size="14.5" fill="#94a3b8">source={getWebViewSource(url)}</text>

  <!-- card: target url -->
  <rect x="1560" y="300" width="320" height="195" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="url(#cardShadow)"/>
  <circle cx="1720" cy="360" r="46" fill="#f0f9ff"/>
  <use href="#globe" transform="translate(1720 362) scale(1.1)"/>
  <text x="1720" y="430" text-anchor="middle" font-size="25" font-weight="700" fill="#0f172a">Target URL</text>
  <text x="1720" y="458" text-anchor="middle" font-size="16" fill="#64748b">DEFAULT_WEBVIEW_URL</text>
  <text x="1720" y="481" text-anchor="middle" font-size="14.5" fill="#94a3b8">constants.app.ts · https://google.com</text>

  <!-- ===== build flow ===== -->

  <!-- card: build script -->
  <rect x="60" y="650" width="320" height="195" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="url(#cardShadow)"/>
  <circle cx="220" cy="712" r="46" fill="#f1f5f9"/>
  <text x="220" y="720" text-anchor="middle" font-size="34" font-weight="800" fill="#334155">&#9654;</text>
  <text x="220" y="780" text-anchor="middle" font-size="25" font-weight="700" fill="#0f172a">yarn build:apk</text>
  <text x="220" y="808" text-anchor="middle" font-size="16" fill="#64748b">package.json script</text>
  <text x="220" y="831" text-anchor="middle" font-size="14.5" fill="#94a3b8">docker compose run eas-builder</text>

  <!-- card: docker -->
  <rect x="560" y="650" width="320" height="195" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="url(#cardShadow)"/>
  <circle cx="720" cy="712" r="46" fill="#eff6ff"/>
  <use href="#docker" transform="translate(720 712) scale(0.62)"/>
  <text x="720" y="780" text-anchor="middle" font-size="25" font-weight="700" fill="#0f172a">Docker Container</text>
  <text x="720" y="808" text-anchor="middle" font-size="16" fill="#64748b">eas-builder service</text>
  <text x="720" y="831" text-anchor="middle" font-size="14.5" fill="#94a3b8">Android SDK + EAS CLI · EXPO_TOKEN</text>

  <!-- card: EAS CLI -->
  <rect x="1060" y="650" width="320" height="195" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="url(#cardShadow)"/>
  <circle cx="1220" cy="712" r="46" fill="#eef2ff"/>
  <use href="#eascloud" transform="translate(1185 688) scale(0.62)"/>
  <text x="1220" y="780" text-anchor="middle" font-size="25" font-weight="700" fill="#0f172a">EAS Build</text>
  <text x="1220" y="808" text-anchor="middle" font-size="16" fill="#64748b">eas build -p android</text>
  <text x="1220" y="831" text-anchor="middle" font-size="14.5" fill="#94a3b8">eas.json · preview profile (apk)</text>

  <!-- card: apk output -->
  <rect x="1560" y="650" width="320" height="195" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="url(#cardShadow)"/>
  <circle cx="1720" cy="712" r="46" fill="#f0fdf4"/>
  <use href="#apk" transform="translate(1720 714) scale(1.05)"/>
  <text x="1720" y="780" text-anchor="middle" font-size="25" font-weight="700" fill="#0f172a">APK Output</text>
  <text x="1720" y="808" text-anchor="middle" font-size="16" fill="#64748b">out/personal-cv.apk</text>
  <text x="1720" y="831" text-anchor="middle" font-size="14.5" fill="#94a3b8">com.klessiton.personalcv</text>

  <!-- ===== arrows : runtime ===== -->
  <line x1="384" y1="397" x2="552" y2="397" stroke="#334155" stroke-width="3.5" marker-end="url(#arrowDark)"/>
  <text x="468" y="380" text-anchor="middle" font-size="16" fill="#334155">registers root</text>

  <line x1="884" y1="397" x2="1052" y2="397" stroke="#334155" stroke-width="3.5" marker-end="url(#arrowDark)"/>
  <text x="968" y="380" text-anchor="middle" font-size="16" fill="#334155">renders</text>

  <line x1="1384" y1="397" x2="1552" y2="397" stroke="#334155" stroke-width="3.5" marker-end="url(#arrowDark)"/>
  <text x="1468" y="380" text-anchor="middle" font-size="16" fill="#334155">loads</text>

  <!-- ===== arrows : build ===== -->
  <line x1="384" y1="747" x2="552" y2="747" stroke="#334155" stroke-width="3.5" marker-end="url(#arrowDark)"/>
  <text x="468" y="730" text-anchor="middle" font-size="16" fill="#334155">eas-builder</text>

  <line x1="884" y1="747" x2="1052" y2="747" stroke="#334155" stroke-width="3.5" marker-end="url(#arrowDark)"/>
  <text x="968" y="730" text-anchor="middle" font-size="16" fill="#334155">runs build</text>

  <line x1="1384" y1="747" x2="1552" y2="747" stroke="#334155" stroke-width="3.5" marker-end="url(#arrowDark)"/>
  <text x="1468" y="730" text-anchor="middle" font-size="16" fill="#334155">emits</text>

  <!-- ===== link : runtime -> build ===== -->
  <path d="M 1220 499 V 573 H 220 V 644" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#arrowSlate)"/>
  <text x="720" y="566" text-anchor="middle" font-size="16" fill="#64748b">same TypeScript source · app.json / assets bundled into the APK</text>

  <!-- ===== legend ===== -->
  <use href="#jsfile" transform="translate(340 934) scale(0.5)"/>
  <text x="374" y="946" font-size="17" fill="#475569">App entry point</text>

  <use href="#react" transform="translate(640 940) scale(0.42)"/>
  <text x="682" y="946" font-size="17" fill="#475569">React Native component</text>

  <use href="#webview" transform="translate(950 936) scale(0.45)"/>
  <text x="996" y="946" font-size="17" fill="#475569">WebView</text>

  <use href="#docker" transform="translate(1150 942) scale(0.55)"/>
  <text x="1205" y="946" font-size="17" fill="#475569">Docker build container</text>

  <use href="#apk" transform="translate(1480 934) scale(0.5)"/>
  <text x="1514" y="946" font-size="17" fill="#475569">Android APK</text>

  <!-- footnote -->
  <text x="960" y="1020" text-anchor="middle" font-size="16" fill="#94a3b8">Entry: index.js &#8594; src/src.app.tsx · Config: src/config/config.app.ts · Build: yarn build:apk &#8594; out/personal-cv.apk</text>
</svg>
