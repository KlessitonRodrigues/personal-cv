name: Deploy Profile Website

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      i18n: ${{ steps.filter.outputs.i18n }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect i18n changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            i18n:
              - 'apps/vite-profile-page/src/public/i18n/pt.json'

  translate:
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.i18n == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Translate
        run: yarn translate out/en.json -l pt,es

      - name: Commit translations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add out/pt.json out/es.json
          if git diff --cached --quiet; then
            echo "No translation changes"
          else
            git commit -m "feat: auto translate out/en.json to pt and es"
            git push
          fi

  deploy:
    needs: [changes, translate]
    if: ${{ always() && !cancelled() && needs.changes.result == 'success' && needs.translate.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Initialize submodules
        run: git submodule update --init --recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build profile page
        run: yarn build
        working-directory: apps/vite-profile-page

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy CDK
        run: yarn cdk deploy --require-approval never
        working-directory: services/aws-vitejs-deploy
